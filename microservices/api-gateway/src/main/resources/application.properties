spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/petcove-microservices-realm

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.urls[0].name=Inventory Service
springdoc.swagger-ui.urls[0].url=/aggregate/inventory-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/aggregate/order-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=Payment Service
springdoc.swagger-ui.urls[2].url=/aggregate/payment-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=User Service
springdoc.swagger-ui.urls[3].url=/aggregate/user-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=API Gateway
springdoc.swagger-ui.urls[4].url=/v3/api-docs


management.endpoints.web.exposure.include=*

spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=reactive